status: AUTHORIZED_FOR_ACCESS
publication_decision: GO_REQUIRED_FOR_FULL_PAPER
preregistered_on: 2026-08-05
sealed_before_physical_access: true

research_question: >-
  At fixed selected-output count, six active rows, model, input, and device,
  does within-row fragmentation cause an RK3576 static row-span organization to
  pay additional padding, tensor-traffic, service-time, and deadline taxes,
  while fixed-shape independent tiles remain a negative control?

causal_objection_resolved: >-
  The existing fifteen masks confound density, active rows, source content,
  position, and horizontal runs. These frozen synthetic pairs change geometry
  while holding selected count, active rows, input pixels, checkpoint,
  dispatch mode, device, and repeat block fixed.

