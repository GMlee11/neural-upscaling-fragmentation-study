analysis:
  paired_statistic: median_of_five_within_block_fractional_differences
  fractional_difference: (fragmented - compact) / compact
  report_every_repeat: true
  confidence_interval: none_claimed_at_n5
  regression_authorized: false
  p_value_claim_authorized: false
  deadline_result_role: descriptive_only

frozen_gates:
  integrity:
    observed_measured_samples_must_equal: 60
    all_checkpoint_catalog_input_and_mask_hashes_match: true
    all_timings_positive_and_finite: true
    all_selected_counts_and_committed_pixels_match_within_pair: true
    unselected_output_commit_forbidden: true
    max_cross_mode_mean_abs_float: 0.001
    max_cross_mode_psnr_delta_db: 0.02
  structural_padding:
    row_span_fragmented_executed_gmac_gt_compact_at_all_densities: true
    row_span_fragmented_tensor_bytes_per_pixel_gt_compact_at_all_densities: true
    exact_mode_executed_gmac_and_tensor_bytes_equal_within_pair: true
  physical_service:
    row_span_positive_paired_service_delta_at_density_count: 3
    row_span_minimum_density_pairs_with_median_penalty_ge_5_percent: 2
  exact_negative_control:
    max_absolute_median_paired_service_delta_percent_each_density: 5.0
  mode_interaction:
    positive_interaction_at_density_count: 3
    minimum_density_pairs_with_interaction_ge_percentage_points: 2
    minimum_interaction_percentage_points: 5.0

