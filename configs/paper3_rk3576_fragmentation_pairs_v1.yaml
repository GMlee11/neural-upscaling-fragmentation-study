execution_design:
  dispatch_modes: [exact, row_spans]
  repetitions_per_mask_mode: 5
  warmup_iterations_per_shape: 2
  measured_samples: 60
  pairing_key: [repeat_index, pair_id, dispatch_mode]
  blocks: 5
  samples_per_block: 12
  block_order: deterministic_randomized_complete_blocks
  randomization_seed: 357603
  pair_members_adjacent_with_orientation_determined_by_seed: true
  warmups_excluded_from_sample_count: true
  outlier_removal_authorized: false
  replacement_samples_authorized: false

hypotheses:
  H1_structural_padding:
    statement: >-
      In row-span mode, fragmented masks execute more static-shape coverage,
      MACs, and tensor bytes per committed pixel than compact masks at every
      density.
    primary: true
  H2_physical_service:
    statement: >-
      In row-span mode, fragmentation yields a positive paired service-time
      penalty at all densities and at least a five-percent median paired penalty
      at two of three densities.
    primary: true
  H3_exact_negative_control:
    statement: >-
      In exact mode, fixed selected count yields identical executed MACs and
      tensor bytes, and compact/fragmented median paired service differs by no
      more than five percent at every density.
    primary: true
  H4_mode_interaction:
    statement: >-
      The row-span compact-to-fragmented service penalty exceeds the exact-mode
      penalty by at least five percentage points at two of three densities and
      is positive at all three.
    primary: false

